<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>게시글 목록</title>
    <link rel="stylesheet" href="/css/sangin/common/postList.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<!-- content -->
<div layout:fragment="content">
    <input type="hidden" id="userId" th:value="${userId}">
    <input type="hidden" id="role" th:value="${role}">
    <input type="hidden" id="category" th:value="${category}">
    <div id="adjust_section">
        <div id="main_section">
            <div id="main_section_header">
                    <div id="post_list_text_box">
                        <div id="tab_free" class="tab" onclick="location.href='/view/common/postList?category=F'">자유게시판
                        </div>
                        <div id="tab_suggestion" class="tab" onclick="location.href='/view/common/postList?category=S'">
                            건의사항
                        </div>
                        <div id="tab_qna" class="tab" onclick="location.href='/view/common/postList?category=Q'">
                            Q&A
                        </div>
                    </div>

                    <select id="pageSizeSelector">
                        <option value="10" selected>10개씩 보기</option>
                        <option value="20">20개씩 보기</option>
                        <option value="50">50개씩 보기</option>
                        <option value="100">100개씩 보기</option>
                    </select>

            </div>
            <div id="post_list_shadow">
                <div id="post_text_box">
                    <span id="post_id_text">고유 ID</span>
                    <span id="post_title_text">게시글 제목</span>
                    <span id="post_created_by_text">작성자</span>
                    <span id="post_created_at_text">작성일</span>
                    <span id="post_delete_btn_text" th:if="${role} == 'ROLE_ADMIN'">삭제</span>
                </div>
                <div id="post_list_container">
                    <!--동적 생성-->
                </div>
            </div>
            <div id="pagination_container" class="pagination"></div>

        </div>
    </div>
</div>
</body>

<!--이거밖에서 스크립트 작성하면 안돌아갑니다...-->
<div layout:fragment="scripts">
    <script src="/js/sangin/common/postList.js"></script>
</div>
</html>
