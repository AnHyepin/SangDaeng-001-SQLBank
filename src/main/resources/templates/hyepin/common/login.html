<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>TITLE</title>
    <link rel="stylesheet" href="/css/hyepin/common/login.css">
</head>
<body>
<!-- content -->
<div layout:fragment="content">
    <!--여기서부터-->
    <form id="loginForm">
        <div class="login-content">
            <input type="text" name="username" placeholder="ID를 입력하세요">
            <input type="text" name="password" placeholder="PW를 입력하세요">
        </div>
    </form>

    <div class="sign-in-btn">
        <img src="/image/icon/sign-in.svg" alt="로그인버튼">
    </div>

    <!--여기까지 작업하시면 됩니다-->
</div>
</body>

<!--이거밖에서 스크립트 작성하면 안돌아갑니다...-->
<div layout:fragment="scripts">
    <script src="/js/hyepin/common/login.js"></script>
</div>
</html>
